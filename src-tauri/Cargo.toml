[package]
name = "murmeli"
version = "0.1.0"
description = "Murmeli — open-source, cross-platform database GUI client"
authors = ["Amir Robin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "murmeli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls-ring", "tls12"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa", "flate2"] }
aes-gcm = "0.11.1"
argon2 = "0.5.3"
rand = "0.10.2"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
csv = "1.3"
flate2 = "1"
regex = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# Phase 8: desktop shell plugins. Updater/process/single-instance/window-state
# are desktop-only; the mobile entry point never registers them (see lib.rs).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

