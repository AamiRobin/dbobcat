<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="dbobcat-title-dark">
  <title id="dbobcat-title-dark">DBobcat mark, tile-free variant for dark surfaces</title>

  <!-- Den as database cylinder with elliptical bottom edge -->
  <defs>
    <clipPath id="dbobcat-mound-clip-dark">
      <path d="M14 78v24a50 14 0 0 0 100 0V78Z"/>
    </clipPath>
  </defs>
  <path d="M14 78v24a50 14 0 0 0 100 0V78Z" fill="#4A5462"/>
  <ellipse cx="64" cy="78" rx="50" ry="14" fill="#5A6475"/>

  <!-- Glacier seam arcs: concentric disc seams, terminated at the silhouette -->
  <g fill="none" stroke="#57A8C4" stroke-width="6" clip-path="url(#dbobcat-mound-clip-dark)">
    <path d="M14 85a50 14 0 0 0 100 0"/>
    <path d="M14 95a50 14 0 0 0 100 0"/>
  </g>

  <!-- Ears: tall tufted lynx ears (the bobcat signature), kink at the tip reads as the tuft -->
  <path d="M46 34 42 3l7 6 9 15Z" fill="#99A2B1"/>
  <path d="M82 34 86 3l-7 6-9 15Z" fill="#99A2B1"/>

  <!-- Cheek ruffs: rounded jowl lobes bowing outward past head and shoulders -->
  <circle cx="45" cy="54" r="13" fill="#99A2B1"/>
  <circle cx="83" cy="54" r="13" fill="#99A2B1"/>

  <!-- Body: sentinel bell -->
  <path d="M64 44c-13 0-23 9-28.5 23-4 10.5-6.5 20-6.5 27h70c0-7-2.5-16.5-6.5-27C87 53 77 44 64 44Z" fill="#99A2B1"/>

  <!-- Head -->
  <circle cx="64" cy="42" r="22" fill="#99A2B1"/>

  <!-- Edelweiss belly and muzzle: nose sits at the muzzle center -->
  <ellipse cx="64" cy="82" rx="11" ry="12" fill="#F1EFE7"/>
  <ellipse cx="64" cy="50.5" rx="11.5" ry="6.5" fill="#F1EFE7"/>

  <!-- Nose: cat triangle -->
  <path d="M64 45 57.5 51.5h13Z" fill="#22262E"/>

  <!-- Eyes: glacier glint -->
  <circle cx="54.5" cy="40" r="3.6" fill="#57A8C4"/>
  <circle cx="73.5" cy="40" r="3.6" fill="#57A8C4"/>
</svg>
