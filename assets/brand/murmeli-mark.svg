<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="murmeli-title">
  <title id="murmeli-title">Murmeli — a sentinel marmot keeping watch over its burrow, drawn as a database cylinder</title>

  <!-- Tile: Bedrock granite, carries its own ground so the mark never floats -->
  <rect width="128" height="128" rx="28" fill="#22262E"/>

  <!-- Burrow mound as database cylinder: lighter Scree front face so it holds on the tile,
       elliptical bottom edge for a true stacked-disc read -->
  <defs>
    <clipPath id="murmeli-mound-clip">
      <path d="M14 78v24a50 14 0 0 0 100 0V78Z"/>
    </clipPath>
  </defs>
  <path d="M14 78v24a50 14 0 0 0 100 0V78Z" fill="#4A5462"/>
  <ellipse cx="64" cy="78" rx="50" ry="14" fill="#5A6475"/>

  <!-- Glacier seam arcs: concentric with rim and bottom ellipse, terminated exactly at the
       cylinder silhouette via clip (no upturned caps) -->
  <g fill="none" stroke="#57A8C4" stroke-width="6" clip-path="url(#murmeli-mound-clip)">
    <path d="M14 85a50 14 0 0 0 100 0"/>
    <path d="M14 95a50 14 0 0 0 100 0"/>
  </g>

  <!-- Ears: small, low on the head sides (rodent placement), behind head -->
  <circle cx="44.5" cy="30.5" r="5" fill="#99A2B1"/>
  <circle cx="83.5" cy="30.5" r="5" fill="#99A2B1"/>

  <!-- Body: sentinel bell -->
  <path d="M64 44c-13 0-23 9-28.5 23-4 10.5-6.5 20-6.5 27h70c0-7-2.5-16.5-6.5-27C87 53 77 44 64 44Z" fill="#99A2B1"/>

  <!-- Head -->
  <circle cx="64" cy="42" r="22" fill="#99A2B1"/>

  <!-- Edelweiss belly and blaze: blaze widened flat, nose sits at its vertical center -->
  <ellipse cx="64" cy="82" rx="11" ry="12" fill="#F1EFE7"/>
  <ellipse cx="64" cy="50.5" rx="13" ry="6.5" fill="#F1EFE7"/>

  <!-- Nose -->
  <rect x="59" y="46.5" width="10" height="8" rx="4" fill="#22262E"/>

  <!-- Eyes: glacier glint -->
  <circle cx="54.5" cy="40" r="3.6" fill="#57A8C4"/>
  <circle cx="73.5" cy="40" r="3.6" fill="#57A8C4"/>
</svg>
