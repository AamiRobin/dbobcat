name: Bug report
description: Something in DBobcat is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the problem, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open …
        3. Click …
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options:
        - MySQL / MariaDB
        - PostgreSQL
        - SQLite
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DBobcat version
      description: From the About dialog, or "nightly" if built from main.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      description: Any error text shown in the UI or on the console. Redact credentials.
