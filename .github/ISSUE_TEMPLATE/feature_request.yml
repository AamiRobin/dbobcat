name: Feature request
description: Suggest an idea or an improvement for DBobcat
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. If HeidiSQL already does this, a link or screenshot helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
